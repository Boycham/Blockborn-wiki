site_name: BlockBorn Wiki
site_description: The official guide to BlockBorn, a Roblox game of islands, eras and the things you build on them.
# Your Pages address (the free github.io one). Change it if you rename the repo.
site_url: https://boycham.github.io/Blockborn-wiki/
repo_url: https://github.com/Boycham/Blockborn-wiki
edit_uri: edit/main/docs/
copyright: BlockBorn is made by JBJ Studios. This wiki is written by the developers.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false            # fonts come from extra.css (Patrick Hand + Nunito)
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
    - content.action.edit   # pencil button on each page opens it for editing on GitHub
  icon:
    admonition:
      note: material/pencil
      tip: material/lightbulb-on
      warning: material/alert

extra:
  # The PLAY button on the home page. Paste your game's Roblox link here.
  play_url: https://www.roblox.com/games/138165659444703/BlockBorn
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The menu. Add a page here to put it in the menu (see README.md).
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - World:
      - world/index.md
  - Progression:
      - Eras: progression/eras.md
  - Combat:
      - Classes: combat/classes.md
